[package]
name = "AX_Shell"
version = "0.2.1"
edition = "2024"

[[bin]]
name = "ax"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"
hostname = "0.4"
os_info = "3"
ansi_term = "0.12"
terminal_size = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
bytes = "1"
